<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>분수 시각화 통합 도구</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

    <style>
        :root {
            --unit-width: 860px;
            --unit-height: 72px;
            --mul-unit-height: 168px;
            --piece-gap: 8px;
            --control-height: 62px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Jua', sans-serif;
            background: #f4f7f6;
            color: #2e2e2e;
            overflow: hidden;
            user-select: none;
        }
        button, input { font: inherit; }
        input { user-select: text; }
        button { -webkit-tap-highlight-color: transparent; }

        .tool-page { display: none; width: 100%; height: 100%; }
        .app-container { display: flex; flex-direction: column; width: 100%; height: 100vh; }

        /* =====================================================
           메인 메뉴
        ====================================================== */
        #main-menu-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
        }
        #main-menu-page .title {
            font-size: 3.35rem;
            margin-bottom: 48px;
            text-shadow: 2px 2px 4px rgba(0,0,0,.08);
        }
        .menu-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 28px; }
        .menu-button {
            width: 280px;
            height: 120px;
            border: 0;
            border-radius: 16px;
            color: #fff;
            font-size: 2.05rem;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(0,0,0,.14);
            transition: transform .18s ease, box-shadow .18s ease;
        }
        .menu-button:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,.18); }
        .btn-addsub { background: #007bff; }
        .btn-mul { background: #6f42c1; }
        .btn-div { background: #28a745; }

        /* =====================================================
           상단 입력 / 버튼 — 모든 높이를 같은 기준으로 정렬
        ====================================================== */
        .controls {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 12px 16px 10px;
            background: #fff;
            border-bottom: 2px solid #e5e5e5;
            box-shadow: 0 4px 12px rgba(0,0,0,.05);
            position: relative;
            z-index: 30;
        }
        .control-block {
            height: 108px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        .control-title-row {
            height: 27px;
            display: flex;
            align-items: center;
        }
        .control-hint {
            height: 19px;
            line-height: 19px;
            font-size: .77rem;
            color: #777;
            text-align: center;
            white-space: nowrap;
        }

        .mode-toggle {
            height: 27px;
            border: 0;
            background: transparent;
            color: #2f2f2f;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 0 2px;
            cursor: pointer;
            font-size: 1.03rem;
        }
        .mode-toggle:hover .mode-badge { transform: translateY(-1px); }
        .mode-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 22px;
            padding: 0 8px;
            border-radius: 999px;
            background: #eef2f7;
            color: #52606d;
            font-size: .76rem;
            transition: transform .15s ease;
        }

        .visual-entry {
            width: 160px;
            height: var(--control-height);
            border: 2px solid #cfcfcf;
            border-radius: 10px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 4px 10px;
        }
        .visual-entry:focus-within { border-color: #007bff; box-shadow: 0 0 0 2px rgba(0,123,255,.08); }
        .entry-pane { display: none; width: 100%; height: 100%; align-items: center; justify-content: center; }
        .value-control[data-mode="fraction"] .pane-fraction,
        .value-control[data-mode="natural"] .pane-natural,
        .value-control[data-mode="mixed"] .pane-mixed { display: flex; }

        .field {
            border: 0;
            outline: none;
            background: transparent;
            text-align: center;
            font-size: 1.18rem;
            min-width: 0;
            color: #111;
        }
        .natural-field { width: 110px; height: 48px; font-size: 1.45rem; }
        .whole-field { width: 54px; height: 48px; font-size: 1.32rem; }
        .fraction-stack {
            width: 68px;
            height: 52px;
            display: grid;
            grid-template-rows: 24px 3px 24px;
            align-items: center;
            justify-items: stretch;
        }
        .fraction-stack .field { width: 100%; height: 24px; font-size: 1.08rem; }
        .fraction-line { height: 3px; border-radius: 3px; background: #222; }
        .mixed-pane { gap: 8px; }

        .common-control { width: 92px; }
        .plain-title { height: 27px; display: flex; align-items: center; justify-content: center; font-size: 1.03rem; }
        .common-den-input {
            width: 92px;
            height: var(--control-height);
            border: 2px solid #cfcfcf;
            border-radius: 10px;
            background: #fff;
            text-align: center;
            font-size: 1.35rem;
            outline: none;
        }
        .common-den-input:focus { border-color: #007bff; }

        .action-block {
            height: 108px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        .action-block::before { content: ''; display: block; height: 27px; flex: 0 0 27px; }
        .action-block::after { content: ''; display: block; height: 19px; flex: 0 0 19px; }

        .btn,
        .operator-button,
        .operator-symbol {
            height: var(--control-height);
            min-height: var(--control-height);
            border-radius: 9px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }
        .btn {
            padding: 0 15px;
            border: 0;
            color: #fff;
            background: #007bff;
            cursor: pointer;
            transition: transform .12s ease, filter .15s ease, background .18s ease;
        }
        .btn:hover { filter: brightness(.93); }
        .btn:active { transform: scale(.98); }
        .btn-secondary { background: #6c757d; }
        .btn-success { background: #28a745; }
        .btn-danger { background: #dc3545; }
        .btn-purple { background: #6f42c1; }
        .btn-fit { background: #495057; }
        .btn-back { background: #f8f9fa; color: #333; border: 2px solid #ccc; }
        .btn-small { height: 38px; min-height: 38px; padding: 0 12px; font-size: .9rem; border-radius: 8px; }
        .btn-sampler { background: #17a2b8; }
        .btn-add-pocket { background: #6c757d; margin: 12px auto 0; display: flex; }

        .operator-button {
            min-width: 62px;
            border: 0;
            background: #ffc107;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
        }
        .operator-symbol { min-width: 42px; font-size: 2rem; font-weight: bold; }
        .control-divider {
            width: 2px;
            height: var(--control-height);
            margin-top: 27px;
            background: #e3e3e3;
        }

        /* =====================================================
           워크스페이스와 '한 화면에 모아보기'
        ====================================================== */
        .workspace {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 18px;
            background: #fdfdfd;
            position: relative;
        }
        .workspace-scale-shell { width: 100%; position: relative; }
        .workspace-inner {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 18px;
            transform-origin: top center;
            transition: transform .55s cubic-bezier(.2,.8,.2,1);
            will-change: transform;
        }
        #mul-page .workspace-inner { align-items: center; }

        .fraction-workspace,
        .step-container {
            width: 100%;
            background: #fff;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 2px 9px rgba(0,0,0,.06);
        }
        #mul-page .step-container { max-width: 1120px; }

        .workspace-label-row,
        .step-label {
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 14px;
            min-height: 50px;
        }
        .workspace-label,
        .step-label-title { font-size: 1.43rem; }
        .step-label-title { flex: 1; }
        .step-note { font-size: .93rem; color: #666; }
        .model-note {
            width: min(100%, var(--unit-width));
            margin: 0 auto 10px;
            color: #666;
            font-size: .89rem;
            line-height: 1.45;
        }

        /* =====================================================
           분수 막대 — 내부 스크롤바 없음
           '1 전체'는 언제나 860px × 72px
        ====================================================== */
        .bar-stack {
            width: var(--unit-width);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .fraction-bar {
            width: var(--unit-width);
            height: var(--unit-height);
            flex: 0 0 auto;
            display: flex;
            border: 3px solid #333;
            border-radius: 10px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,.08);
        }
        .fraction-piece { height: 100%; flex: 0 0 auto; }

        /* =====================================================
           조각 트레이 — 스크롤 없이 균형 있게 정렬
        ====================================================== */
        .piece-tray-wrap {
            width: 100%;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 2px dashed #d7d7d7;
        }
        .piece-tray-title { margin-bottom: 8px; font-size: 1.02rem; color: #555; }
        .piece-tray-shell {
            width: 100%;
            min-height: 94px;
            border: 2px dashed #b9c2cc;
            border-radius: 12px;
            padding: 12px;
            background: #fafbfc;
            overflow: visible;
        }
        .piece-tray {
            width: max-content;
            max-width: 100%;
            margin: 0 auto;
            display: grid;
            gap: var(--piece-gap);
            justify-content: center;
            align-content: start;
        }
        .piece-token {
            border: 2px solid #222;
            border-radius: 6px;
            box-shadow: 0 3px 8px rgba(0,0,0,.15);
            cursor: grab;
            touch-action: none;
            position: relative;
            z-index: 1;
            transition: transform .13s ease, box-shadow .13s ease, opacity .13s ease;
        }
        .piece-token:hover { box-shadow: 0 6px 12px rgba(0,0,0,.18); }
        .piece-token.in-slot {
            width: 100% !important;
            height: 100% !important;
            border-radius: 4px;
            box-shadow: none;
            transform: none !important;
        }
        .piece-token.drag-source { opacity: .23; }
        .drag-ghost {
            position: fixed;
            z-index: 99999;
            pointer-events: none;
            opacity: .9;
            border: 2px solid #111;
            border-radius: 6px;
            box-shadow: 0 12px 26px rgba(0,0,0,.28);
        }

        /* =====================================================
           덧셈/뺄셈 자석 계산판 — 반드시 '분수 막대' 형태
        ====================================================== */
        #as_result-workspace { display: none; border: 3px solid #6f42c1; }
        .magnet-board {
            border: 3px dashed #6f42c1;
            border-radius: 14px;
            padding: 14px;
            background: rgba(111,66,193,.05);
        }
        .magnet-board h3 { font-size: 1.28rem; margin-bottom: 5px; }
        .magnet-help { color: #666; margin-bottom: 12px; line-height: 1.45; }
        .magnet-bars {
            width: var(--unit-width);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .magnet-fraction-bar {
            width: var(--unit-width);
            height: var(--unit-height);
            display: grid;
            border: 3px solid #333;
            border-radius: 10px;
            overflow: hidden;
            background: #fff;
        }
        .magnet-slot,
        .pocket-slot {
            position: relative;
            min-width: 0;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f7f5fb;
            transition: transform .12s ease, background .12s ease, box-shadow .12s ease;
        }
        .magnet-slot:not(:last-child) { border-right: 2px dashed #8a8a8a; }
        .magnet-slot::after,
        .pocket-slot::after {
            content: '＋';
            color: #b0a7c6;
            font-size: 1.05rem;
            position: absolute;
            pointer-events: none;
        }
        .magnet-slot:has(.piece-token)::after,
        .pocket-slot:has(.piece-token)::after { display: none; }
        .magnet-hot {
            background: #ddd3f4 !important;
            box-shadow: inset 0 0 0 3px #6f42c1;
            transform: scale(1.03);
        }
        .snap-flash { animation: snapFlash .22s ease; }
        @keyframes snapFlash {
            0% { transform: scale(.92); }
            70% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }
        .piece-canceling { animation: piecePop .34s ease forwards; }
        @keyframes piecePop {
            0% { transform: scale(1); opacity: 1; }
            45% { transform: scale(1.35) rotate(8deg); opacity: .85; }
            100% { transform: scale(.05) rotate(-15deg); opacity: 0; }
        }
        .cancel-burst {
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.6rem;
            z-index: 10;
            animation: burst .42s ease forwards;
            pointer-events: none;
        }
        @keyframes burst {
            0% { transform: translate(-50%,-50%) scale(.3); opacity: 0; }
            45% { transform: translate(-50%,-50%) scale(1.35); opacity: 1; }
            100% { transform: translate(-50%,-85%) scale(.8); opacity: 0; }
        }
        .result-summary { margin-top: 16px; padding-top: 16px; border-top: 2px solid #eee; }
        .result-formula {
            font-size: 1.5rem;
            text-align: center;
            padding: 13px;
            border: 2px solid #e0e0e0;
            background: #f8f9fa;
            border-radius: 9px;
            margin-bottom: 14px;
        }

        /* =====================================================
           곱셈
        ====================================================== */
        .mul-model-stack {
            width: var(--unit-width);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .mul-model-bar {
            width: var(--unit-width);
            height: var(--mul-unit-height);
            border: 3px solid #333;
            border-radius: 11px;
            overflow: hidden;
            display: grid;
            background: #f1f3f5;
            box-shadow: 0 4px 10px rgba(0,0,0,.08);
        }
        .mul-cell { min-width: 0; min-height: 0; }
        .mul-legend {
            width: min(100%, var(--unit-width));
            margin: 10px auto 0;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: .91rem;
            color: #555;
        }
        .legend-chip { display: inline-flex; align-items: center; gap: 6px; }
        .legend-color { width: 18px; height: 18px; border: 1px solid #444; border-radius: 4px; }

        /* =====================================================
           나눗셈 주머니
        ====================================================== */
        #div_result-workspace { display: none; border: 3px solid #6f42c1; }
        .division-pockets-wrap { display: flex; flex-direction: column; gap: 12px; }
        .division-pocket-card { width: 100%; }
        .pocket-caption { margin-bottom: 6px; color: #555; }
        .division-pocket {
            width: max-content;
            max-width: 100%;
            margin: 0 auto;
            display: grid;
            gap: var(--piece-gap);
            justify-content: center;
            padding: 12px;
            border: 3px dashed #28a745;
            border-radius: 12px;
            background: rgba(40,167,69,.06);
        }
        .pocket-slot {
            border: 2px dashed #9dcba7;
            border-radius: 7px;
            background: #f5fbf6;
        }
        .pocket-slot::after { color: #91b99a; }

        @media (max-width: 1100px) {
            .controls { justify-content: flex-start; }
            .control-divider { display: none; }
        }
        @media (max-width: 900px) {
            .workspace { padding: 12px; }
            .fraction-workspace, .step-container { padding: 14px; }
        }
    </style>
</head>
<body>

    <div id="main-menu-page">
        <h1 class="title">분수 시각화 학습 도구 🧮</h1>
        <nav class="menu-container">
            <button id="btn-goto-addsub" class="menu-button btn-addsub">덧셈 & 뺄셈 (+, -)</button>
            <button id="btn-goto-mul" class="menu-button btn-mul">곱셈 (×)</button>
            <button id="btn-goto-div" class="menu-button btn-div">나눗셈 (÷)</button>
        </nav>
    </div>

    <!-- =====================================================
         덧셈 / 뺄셈
    ====================================================== -->
    <div id="addsub-page" class="tool-page">
        <div class="app-container">
            <div class="controls">
                <div id="as_inputA" class="control-block value-control" data-mode="fraction" data-label="분수 1">
                    <div class="control-title-row">
                        <button type="button" class="mode-toggle" title="눌러서 분수 → 자연수 → 대분수 입력으로 바꿉니다.">
                            <span class="mode-label">분수 1</span><span class="mode-badge">분수 ↻</span>
                        </button>
                    </div>
                    <div class="visual-entry">
                        <div class="entry-pane pane-fraction">
                            <div class="fraction-stack">
                                <input class="field frac-num" type="number" min="0" value="1" aria-label="분수 1 분자">
                                <div class="fraction-line"></div>
                                <input class="field frac-den" type="number" min="1" value="2" aria-label="분수 1 분모">
                            </div>
                        </div>
                        <div class="entry-pane pane-natural">
                            <input class="field natural-field whole-num" type="number" min="0" value="1" aria-label="분수 1 자연수">
                        </div>
                        <div class="entry-pane pane-mixed mixed-pane">
                            <input class="field whole-field mixed-whole" type="number" min="0" value="1" aria-label="분수 1 자연수 부분">
                            <div class="fraction-stack">
                                <input class="field mixed-num" type="number" min="0" value="1" aria-label="분수 1 대분수 분자">
                                <div class="fraction-line"></div>
                                <input class="field mixed-den" type="number" min="1" value="2" aria-label="분수 1 대분수 분모">
                            </div>
                        </div>
                    </div>
                    <div class="control-hint">제목을 눌러 입력 모양 변경</div>
                </div>

                <div class="action-block"><button id="as_operatorBtn" class="operator-button" aria-label="연산자 바꾸기">+</button></div>

                <div id="as_inputB" class="control-block value-control" data-mode="fraction" data-label="분수 2">
                    <div class="control-title-row">
                        <button type="button" class="mode-toggle" title="눌러서 분수 → 자연수 → 대분수 입력으로 바꿉니다.">
                            <span class="mode-label">분수 2</span><span class="mode-badge">분수 ↻</span>
                        </button>
                    </div>
                    <div class="visual-entry">
                        <div class="entry-pane pane-fraction">
                            <div class="fraction-stack">
                                <input class="field frac-num" type="number" min="0" value="1" aria-label="분수 2 분자">
                                <div class="fraction-line"></div>
                                <input class="field frac-den" type="number" min="1" value="3" aria-label="분수 2 분모">
                            </div>
                        </div>
                        <div class="entry-pane pane-natural">
                            <input class="field natural-field whole-num" type="number" min="0" value="1" aria-label="분수 2 자연수">
                        </div>
                        <div class="entry-pane pane-mixed mixed-pane">
                            <input class="field whole-field mixed-whole" type="number" min="0" value="1" aria-label="분수 2 자연수 부분">
                            <div class="fraction-stack">
                                <input class="field mixed-num" type="number" min="0" value="1" aria-label="분수 2 대분수 분자">
                                <div class="fraction-line"></div>
                                <input class="field mixed-den" type="number" min="1" value="3" aria-label="분수 2 대분수 분모">
                            </div>
                        </div>
                    </div>
                    <div class="control-hint">제목을 눌러 입력 모양 변경</div>
                </div>

                <div class="control-divider"></div>
                <div class="action-block"><button id="as_createBtn" class="btn">생성하기</button></div>

                <div class="control-block common-control">
                    <div class="plain-title">공통 분모</div>
                    <input id="as_commonDen" class="common-den-input" type="number" value="6" min="1">
                    <div class="control-hint">공배수 입력</div>
                </div>

                <div class="action-block"><button id="as_convertBtn" class="btn btn-secondary">통분하기</button></div>
                <div class="action-block"><button id="as_resultBtn" class="btn btn-success">결과보기</button></div>
                <div class="action-block"><button class="btn btn-fit fit-view-btn">🔎 한 화면에 모아보기</button></div>
                <div class="action-block"><button id="as_resetBtn" class="btn btn-danger">다시하기</button></div>
                <div class="action-block"><button class="btn btn-back">⬅️ 메인 메뉴</button></div>
            </div>

            <div id="as_workspace" class="workspace">
                <div class="workspace-scale-shell">
                    <div class="workspace-inner">
                        <div id="as_workspace-a" class="fraction-workspace"></div>
                        <div id="as_workspace-b" class="fraction-workspace"></div>
                        <div id="as_result-workspace" class="fraction-workspace"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- =====================================================
         곱셈

    <script>
        /* =====================================================
           공통 상수 / 수학 유틸
        ====================================================== */
        const UNIT_WIDTH = 860;
        const UNIT_HEIGHT = 72;
        const MUL_UNIT_HEIGHT = 168;
        const GAP = 8;

        const COLORS = {
            A: '#2d8cf0',
            B: '#28a745',
            RESULT: '#6f42c1',
            A_LIGHT: '#b9dcff',
            EMPTY: '#f1f3f5'
        };

        function formatFraction(num, den) {
            return den === 1 ? `${num}` : `${num}/${den}`;
        }

        function intValue(el) {
            const value = Number(el.value);
            return Number.isInteger(value) ? value : NaN;
        }

        /* =====================================================
           시각적 입력기: 분수 / 자연수 / 대분수
        ====================================================== */
        const MODE_ORDER = ['fraction', 'natural', 'mixed'];
        const MODE_TEXT = { fraction: '분수', natural: '자연수', mixed: '대분수' };

        function setupValueControl(control) {
            const toggle = control.querySelector('.mode-toggle');
            const badge = control.querySelector('.mode-badge');
            const label = control.dataset.label || '수';

            function updateBadge() {
                badge.textContent = `${MODE_TEXT[control.dataset.mode]} ↻`;
                control.querySelector('.mode-label').textContent = label;
            }

            toggle.addEventListener('click', () => {
                const now = MODE_ORDER.indexOf(control.dataset.mode);
                control.dataset.mode = MODE_ORDER[(now + 1) % MODE_ORDER.length];
                updateBadge();
                const active = control.querySelector('.entry-pane[style*="display"]');
                const firstVisible = [...control.querySelectorAll('.entry-pane')]
                    .find(p => getComputedStyle(p).display !== 'none');
                firstVisible?.querySelector('input')?.focus();
            });

            updateBadge();
        }

        function setValueControl(control, config) {
            const mode = config.mode || 'fraction';
            control.dataset.mode = mode;
            control.querySelector('.mode-badge').textContent = `${MODE_TEXT[mode]} ↻`;

            if (config.fracNum !== undefined) control.querySelector('.frac-num').value = config.fracNum;
            if (config.fracDen !== undefined) control.querySelector('.frac-den').value = config.fracDen;
            if (config.whole !== undefined) control.querySelector('.whole-num').value = config.whole;
            if (config.mixedWhole !== undefined) control.querySelector('.mixed-whole').value = config.mixedWhole;
            if (config.mixedNum !== undefined) control.querySelector('.mixed-num').value = config.mixedNum;
            if (config.mixedDen !== undefined) control.querySelector('.mixed-den').value = config.mixedDen;
        }

        function readValueControl(control, label) {
            const mode = control.dataset.mode;

            if (mode === 'natural') {
                const whole = intValue(control.querySelector('.whole-num'));
                if (!Number.isInteger(whole) || whole < 0) {
                    alert(`${label}: 자연수는 0 이상의 정수로 입력해주세요.`);
                    return null;
                }
                return { num: whole, den: 1, source: `${whole}`, mode };
            }

            if (mode === 'fraction') {
                const num = intValue(control.querySelector('.frac-num'));
                const den = intValue(control.querySelector('.frac-den'));
                if (!Number.isInteger(num) || num < 0) {
                    alert(`${label}: 분자는 0 이상의 정수로 입력해주세요.`);
                    return null;
                }
                if (!Number.isInteger(den) || den <= 0) {
                    alert(`${label}: 분모는 1 이상의 자연수로 입력해주세요.`);
                    return null;
                }
                return { num, den, source: `${num}/${den}`, mode };
            }

            const whole = intValue(control.querySelector('.mixed-whole'));
            const num = intValue(control.querySelector('.mixed-num'));
            const den = intValue(control.querySelector('.mixed-den'));
            if (!Number.isInteger(whole) || whole < 0) {
                alert(`${label}: 대분수의 자연수 부분은 0 이상의 정수로 입력해주세요.`);
                return null;
            }
            if (!Number.isInteger(num) || num < 0) {
                alert(`${label}: 대분수의 분자는 0 이상의 정수로 입력해주세요.`);
                return null;
            }
            if (!Number.isInteger(den) || den <= 0) {
                alert(`${label}: 대분수의 분모는 1 이상의 자연수로 입력해주세요.`);
                return null;
            }
            if (num >= den) {
                alert(`${label}: 대분수의 분수 부분은 분자가 분모보다 작아야 합니다.`);
                return null;
            }
            return {
                num: whole * den + num,
                den,
                source: `${whole}와 ${num}/${den}`,
                mode
            };
        }

        /* =====================================================
           '한 화면에 모아보기' — 전체를 같은 비율로 축소
           원래 보기에서는 1 전체의 크기가 절대 바뀌지 않음
        ====================================================== */
        function createFitController(page, workspace) {
            const btn = page.querySelector('.fit-view-btn');
            const shell = workspace.querySelector('.workspace-scale-shell');
            const inner = workspace.querySelector('.workspace-inner');
            let fitted = false;
            let scale = 1;

            function naturalHeight() {
                const oldTransform = inner.style.transform;
                inner.style.transform = 'scale(1)';
                const h = inner.scrollHeight;
                inner.style.transform = oldTransform;
                return h;
            }

            function refresh() {
                requestAnimationFrame(() => {
                    if (!fitted) {
                        scale = 1;
                        inner.style.transform = 'scale(1)';
                        shell.style.height = 'auto';
                        btn.textContent = '🔎 한 화면에 모아보기';
                        return;
                    }

                    const h = Math.max(1, naturalHeight());
                    const w = Math.max(inner.scrollWidth, UNIT_WIDTH + 40);
                    const availableH = Math.max(180, workspace.clientHeight - 12);
                    const availableW = Math.max(320, workspace.clientWidth - 12);
                    scale = Math.min(1, availableH / h, availableW / w);

                    inner.style.transform = `scale(${scale})`;
                    shell.style.height = `${Math.ceil(h * scale)}px`;
                    btn.textContent = `↔ 원래 크기로 보기 (${Math.round(scale * 100)}%)`;
                    workspace.scrollTo({ top: 0, behavior: 'smooth' });
                });
            }

            btn.addEventListener('click', () => {
                fitted = !fitted;
                refresh();
            });

            window.addEventListener('resize', () => { if (fitted) refresh(); });

            return {
                refresh,
                isFitted: () => fitted,
                reset: () => {
                    fitted = false;
                    inner.style.transform = 'scale(1)';
                    shell.style.height = 'auto';
                    btn.textContent = '🔎 한 화면에 모아보기';
                }
            };
        }

        /* =====================================================
           조각 정렬 / 드래그
        ====================================================== */
        function balancedColumns(count, itemWidth, maxWidth = UNIT_WIDTH + 44) {
            if (count <= 0) return 1;
            const fit = Math.max(1, Math.min(count, Math.floor((maxWidth + GAP) / (itemWidth + GAP))));
            if (count <= 4) return Math.min(count, fit);
            if (fit === 1) return 1;

            let bestCols = Math.min(fit, Math.ceil(count / 2));
            let bestScore = Infinity;

            for (let cols = 2; cols <= fit; cols++) {
                const rows = Math.ceil(count / cols);
                if (rows < 2) continue;
                const last = count - (rows - 1) * cols;
                const imbalance = cols - last;
                const aspect = cols / rows;
                const score = imbalance * 12 + Math.abs(aspect - 1.7);
                if (score < bestScore) {
                    bestScore = score;
                    bestCols = cols;
                }
            }
            return bestCols;
        }

        function clearHotSlots(scope = document) {
            scope.querySelectorAll('.magnet-hot').forEach(el => el.classList.remove('magnet-hot'));
        }

        function nearestSlot(slots, x, y, threshold, acceptFn = () => true) {
            let best = null;
            let bestDist = Infinity;
            slots.forEach(slot => {
                if (!acceptFn(slot)) return;
                const r = slot.getBoundingClientRect();
                const cx = r.left + r.width / 2;
                const cy = r.top + r.height / 2;
                const d = Math.hypot(x - cx, y - cy);
                if (d < bestDist) {
                    best = slot;
                    bestDist = d;
                }
            });
            return bestDist <= threshold ? best : null;
        }

        function startGhostDrag(token, event, resolver) {
            if (event.button !== undefined && event.button !== 0) return;
            event.preventDefault();

            const rect = token.getBoundingClientRect();
            const ghost = token.cloneNode(true);
            ghost.className = 'drag-ghost';
            ghost.style.width = `${rect.width}px`;
            ghost.style.height = `${rect.height}px`;
            ghost.style.backgroundColor = token.dataset.color || getComputedStyle(token).backgroundColor;
            document.body.appendChild(ghost);
            token.classList.add('drag-source');

            const offsetX = event.clientX - rect.left;
            const offsetY = event.clientY - rect.top;

            function move(clientX, clientY) {
                ghost.style.left = `${clientX - offsetX}px`;
                ghost.style.top = `${clientY - offsetY}px`;
                clearHotSlots();
                const candidate = resolver('move', token, clientX, clientY) || null;
                if (candidate) candidate.classList.add('magnet-hot');
            }

            function cleanup() {
                document.removeEventListener('pointermove', onMove);
                document.removeEventListener('pointerup', finish);
                document.removeEventListener('pointercancel', cancel);
                clearHotSlots();
                ghost.remove();
                token.classList.remove('drag-source');
            }

            function finish(e) {
                cleanup();
                resolver('drop', token, e.clientX, e.clientY);
            }
            function cancel() { cleanup(); }
            function onMove(e) { move(e.clientX, e.clientY); }

            move(event.clientX, event.clientY);
            document.addEventListener('pointermove', onMove);
            document.addEventListener('pointerup', finish, { once: true });
            document.addEventListener('pointercancel', cancel, { once: true });
        }

        function enableFreeTranslateDrag(token) {
            token.addEventListener('pointerdown', event => {
                if (event.button !== undefined && event.button !== 0) return;
                event.preventDefault();
                token.setPointerCapture?.(event.pointerId);

                const startX = event.clientX;
                const startY = event.clientY;
                const baseX = Number(token.dataset.dx || 0);
                const baseY = Number(token.dataset.dy || 0);
                token.style.zIndex = '20';
                token.style.transition = 'none';

                function onMove(e) {
                    const dx = baseX + e.clientX - startX;
                    const dy = baseY + e.clientY - startY;
                    token.dataset.dx = dx;
                    token.dataset.dy = dy;
                    token.style.transform = `translate(${dx}px, ${dy}px)`;
                }

                function onUp(e) {
                    token.removeEventListener('pointermove', onMove);
                    token.removeEventListener('pointerup', onUp);
                    token.removeEventListener('pointercancel', onUp);
                    token.releasePointerCapture?.(e.pointerId);
                    token.style.zIndex = '1';
                    token.style.transition = 'transform .13s ease, box-shadow .13s ease, opacity .13s ease';
                }

                token.addEventListener('pointermove', onMove);
                token.addEventListener('pointerup', onUp);
                token.addEventListener('pointercancel', onUp);
            });
        }

        function createPieceToken(width, height, color, role, resolver = null) {
            const token = document.createElement('div');
            token.className = 'piece-token';
            token.style.width = `${width}px`;
            token.style.height = `${height}px`;
            token.style.backgroundColor = color;
            token.dataset.color = color;
            token.dataset.role = role;

            if (resolver) {
                token.addEventListener('pointerdown', e => startGhostDrag(token, e, resolver));
            } else {
                enableFreeTranslateDrag(token);
            }
            return token;
        }

        function renderPieceTray(container, count, pieceWidth, pieceHeight, color, role, resolver = null, titleText = '') {
            container.querySelector('.piece-tray-wrap')?.remove();

            const wrap = document.createElement('div');
            wrap.className = 'piece-tray-wrap';

            const title = document.createElement('div');
            title.className = 'piece-tray-title';
            title.textContent = titleText || `꺼낸 조각 ${count}개 — 한 번에 모두 꺼냈습니다.`;
            wrap.appendChild(title);

            const shell = document.createElement('div');
            shell.className = 'piece-tray-shell';
            const tray = document.createElement('div');
            tray.className = 'piece-tray';

            const cols = balancedColumns(Math.max(1, count), pieceWidth);
            tray.style.gridTemplateColumns = `repeat(${cols}, ${pieceWidth}px)`;
            tray.style.gridAutoRows = `${pieceHeight}px`;

            for (let i = 0; i < count; i++) {
                tray.appendChild(createPieceToken(pieceWidth, pieceHeight, color, role, resolver));
            }

            shell.appendChild(tray);
            wrap.appendChild(shell);
            container.appendChild(wrap);
            return wrap;
        }

        /* =====================================================
           분수 막대 그리기
        ====================================================== */
        function addModelNote(parent, text = '※ “1 전체”는 항상 같은 크기입니다. 화면에 많이 들어오게 보고 싶을 때만 [한 화면에 모아보기]를 누르세요.') {
            const note = document.createElement('div');
            note.className = 'model-note';
            note.textContent = text;
            parent.appendChild(note);
        }

        function drawFractionBars(container, num, den, origDen, color, labelText, options = {}) {
            const { sampler = false, samplerRole = 'A', samplerResolver = null, fitController = null } = options;
            container.dataset.currentNum = num;
            container.dataset.currentDen = den;
            container.innerHTML = '';

            const labelRow = document.createElement('div');
            labelRow.className = 'workspace-label-row';
            const label = document.createElement('div');
            label.className = 'workspace-label';
            label.textContent = labelText;
            labelRow.appendChild(label);

            if (sampler) {
                const btn = document.createElement('button');
                btn.className = 'btn btn-small btn-sampler';
                btn.textContent = '조각 꺼내기';
                btn.addEventListener('click', () => {
                    renderPieceTray(
                        container,
                        num,
                        UNIT_WIDTH / den,
                        UNIT_HEIGHT,
                        color,
                        samplerRole,
                        samplerResolver
                    );
                    fitController?.refresh();
                });
                labelRow.appendChild(btn);
            }
            container.appendChild(labelRow);
            addModelNote(container);

            const stack = document.createElement('div');
            stack.className = 'bar-stack';
            container.appendChild(stack);

            if (num <= 0) {
                const bar = document.createElement('div');
                bar.className = 'fraction-bar';
                for (let i = 0; i < den; i++) {
                    const piece = document.createElement('div');
                    piece.className = 'fraction-piece';
                    piece.style.width = `${UNIT_WIDTH / den}px`;
                    piece.style.backgroundColor = '#fff';
                    if (i < den - 1) piece.style.borderRight = '3px solid red';
                    bar.appendChild(piece);
                }
                stack.appendChild(bar);
                return;
            }

            const totalBars = Math.ceil(num / den);
            const ratio = den / origDen;

            for (let barIndex = 0; barIndex < totalBars; barIndex++) {
                const bar = document.createElement('div');
                bar.className = 'fraction-bar';
                const start = barIndex * den;
                const shadedCount = Math.max(0, Math.min(den, num - start));

                for (let i = 0; i < den; i++) {
                    const piece = document.createElement('div');
                    piece.className = 'fraction-piece';
                    piece.style.width = `${UNIT_WIDTH / den}px`;
                    piece.style.backgroundColor = i < shadedCount ? color : '#fff';
                    if (i < den - 1) {
                        if (ratio === 1 || (i + 1) % ratio === 0) {
                            piece.style.borderRight = '3px solid red';
                        } else {
                            piece.style.borderRight = '3px dashed #777';
                        }
                    }
                    bar.appendChild(piece);
                }
                stack.appendChild(bar);
            }
        }

        /* =====================================================
           덧셈 / 뺄셈
        ====================================================== */
        function initAddSubTool(page) {
            const inputA = page.querySelector('#as_inputA');
            const inputB = page.querySelector('#as_inputB');
            const operatorBtn = page.querySelector('#as_operatorBtn');
            const createBtn = page.querySelector('#as_createBtn');
            const commonDenInput = page.querySelector('#as_commonDen');
            const convertBtn = page.querySelector('#as_convertBtn');
            const resultBtn = page.querySelector('#as_resultBtn');
            const resetBtn = page.querySelector('#as_resetBtn');
            const workspace = page.querySelector('#as_workspace');
            const wsA = page.querySelector('#as_workspace-a');
            const wsB = page.querySelector('#as_workspace-b');
            const resultWs = page.querySelector('#as_result-workspace');
            const fit = createFitController(page, workspace);

            let state = { a: null, b: null, commonDen: null };

            function addSubResolver(phase, token, x, y) {
                const slots = [...resultWs.querySelectorAll('.magnet-slot')];
                if (!slots.length) return null;
                const op = operatorBtn.textContent.trim();
                const rect = token.getBoundingClientRect();
                const threshold = Math.max(54, Math.max(rect.width, rect.height) * .7);

                const target = nearestSlot(slots, x, y, threshold, slot => {
                    const occupied = slot.querySelector('.piece-token');
                    if (!occupied || occupied === token) return true;
                    return op === '-' && occupied.dataset.role !== token.dataset.role;
                });

                if (phase === 'move') return target;
                if (!target) return null;

                const occupied = target.querySelector('.piece-token');
                if (op === '-' && occupied && occupied !== token && occupied.dataset.role !== token.dataset.role) {
                    cancelPieces(target, occupied, token);
                    return target;
                }

                target.appendChild(token);
                token.classList.add('in-slot');
                target.classList.add('snap-flash');
                setTimeout(() => target.classList.remove('snap-flash'), 230);
                return target;
            }

            function cancelPieces(slot, oldToken, newToken) {
                slot.appendChild(newToken);
                newToken.classList.add('in-slot', 'piece-canceling');
                oldToken.classList.add('piece-canceling');
                const burst = document.createElement('div');
                burst.className = 'cancel-burst';
                burst.textContent = '✨';
                slot.appendChild(burst);
                setTimeout(() => {
                    oldToken.remove();
                    newToken.remove();
                    burst.remove();
                }, 360);
            }

            function createInitial() {
                const a = readValueControl(inputA, '분수 1');
                const b = readValueControl(inputB, '분수 2');
                if (!a || !b) return;

                state = { a, b, commonDen: null };
                resultWs.style.display = 'none';
                resultWs.innerHTML = '';

                drawFractionBars(wsA, a.num, a.den, a.den, COLORS.A,
                    `분수 1: ${a.source}`,
                    { sampler: true, samplerRole: 'A', samplerResolver: addSubResolver, fitController: fit });
                drawFractionBars(wsB, b.num, b.den, b.den, COLORS.B,
                    `분수 2: ${b.source}`,
                    { sampler: true, samplerRole: 'B', samplerResolver: addSubResolver, fitController: fit });
                fit.refresh();
            }

            function convert() {
                const a = readValueControl(inputA, '분수 1');
                const b = readValueControl(inputB, '분수 2');
                if (!a || !b) return;

                const commonDen = Number(commonDenInput.value);
                if (!Number.isInteger(commonDen) || commonDen <= 0) {
                    alert('공통 분모는 1 이상의 자연수로 입력해주세요.');
                    return;
                }
                if (commonDen % a.den !== 0 || commonDen % b.den !== 0) {
                    alert(`${a.den}과 ${b.den}의 공배수인 공통 분모를 입력해주세요.`);
                    return;
                }

                const numA = a.num * (commonDen / a.den);
                const numB = b.num * (commonDen / b.den);
                state = { a, b, commonDen, numA, numB };

                drawFractionBars(wsA, numA, commonDen, a.den, COLORS.A,
                    `분수 1 (통분): ${numA}/${commonDen}`,
                    { sampler: true, samplerRole: 'A', samplerResolver: addSubResolver, fitController: fit });
                drawFractionBars(wsB, numB, commonDen, b.den, COLORS.B,
                    `분수 2 (통분): ${numB}/${commonDen}`,
                    { sampler: true, samplerRole: 'B', samplerResolver: addSubResolver, fitController: fit });

                setupCalculationBoard();
                fit.refresh();
            }

            function setupCalculationBoard() {
                if (!state.commonDen) return;
                const { numA, numB, commonDen } = state;
                const op = operatorBtn.textContent.trim();

                resultWs.style.display = 'block';
                resultWs.innerHTML = '';

                const titleRow = document.createElement('div');
                titleRow.className = 'workspace-label-row';
                const title = document.createElement('div');
                title.className = 'workspace-label';
                title.textContent = op === '+' ? '계산판 — 같은 크기의 조각을 이어 붙여 보세요' : '계산판 — 다른 색의 같은 크기 조각을 만나게 해 보세요';
                titleRow.appendChild(title);
                resultWs.appendChild(titleRow);

                const board = document.createElement('div');
                board.className = 'magnet-board';
                const h3 = document.createElement('h3');
                h3.textContent = op === '+' ? '자석 계산판 🧲' : '자석 계산판 🧲 · 만나면 뿅! ✨';
                board.appendChild(h3);

                const help = document.createElement('div');
                help.className = 'magnet-help';
                help.textContent = op === '+'
                    ? `한 줄 전체가 1이고, 한 칸은 1/${commonDen}입니다. 빈 칸 가까이 조각을 가져가면 착 붙습니다.`
                    : `한 줄 전체가 1이고, 한 칸은 1/${commonDen}입니다. 파란 조각과 초록 조각을 같은 칸에서 만나게 하면 함께 사라집니다.`;
                board.appendChild(help);

                const needed = Math.max(1, op === '+' ? numA + numB : Math.max(numA, numB));
                const barCount = Math.max(1, Math.ceil(needed / commonDen));
                const bars = document.createElement('div');
                bars.className = 'magnet-bars';

                for (let b = 0; b < barCount; b++) {
                    const bar = document.createElement('div');
                    bar.className = 'magnet-fraction-bar';
                    bar.style.gridTemplateColumns = `repeat(${commonDen}, 1fr)`;
                    for (let i = 0; i < commonDen; i++) {
                        const slot = document.createElement('div');
                        slot.className = 'magnet-slot';
                        bar.appendChild(slot);
                    }
                    bars.appendChild(bar);
                }

                board.appendChild(bars);
                resultWs.appendChild(board);
            }

            function showResult() {
                if (!state.commonDen) {
                    alert('먼저 [통분하기]를 눌러주세요.');
                    return;
                }
                resultWs.querySelector('.result-summary')?.remove();

                const { a, b, commonDen, numA, numB } = state;
                const op = operatorBtn.textContent.trim();
                const resultNum = op === '+' ? numA + numB : numA - numB;

                const summary = document.createElement('div');
                summary.className = 'result-summary';
                const formula = document.createElement('div');
                formula.className = 'result-formula';
                formula.textContent = `(${formatFraction(a.num, a.den)}) ${op} (${formatFraction(b.num, b.den)}) = (${numA}/${commonDen}) ${op} (${numB}/${commonDen}) = ${resultNum}/${commonDen}`;
                summary.appendChild(formula);

                if (resultNum < 0) {
                    const msg = document.createElement('div');
                    msg.className = 'workspace-label';
                    msg.style.color = '#dc3545';
                    msg.textContent = '결과가 0보다 작아서 막대 시각화는 생략합니다.';
                    summary.appendChild(msg);
                } else {
                    const visual = document.createElement('div');
                    drawFractionBars(visual, resultNum, commonDen, commonDen, COLORS.RESULT, `결과: ${resultNum}/${commonDen}`);
                    summary.appendChild(visual);
                }
                resultWs.appendChild(summary);
                fit.refresh();
            }

            operatorBtn.addEventListener('click', () => {
                operatorBtn.textContent = operatorBtn.textContent.trim() === '+' ? '-' : '+';
                operatorBtn.style.background = operatorBtn.textContent.trim() === '+' ? '#ffc107' : '#17a2b8';
                if (state.commonDen) setupCalculationBoard();
                fit.refresh();
            });
            createBtn.addEventListener('click', createInitial);
            convertBtn.addEventListener('click', convert);
            resultBtn.addEventListener('click', showResult);
            resetBtn.addEventListener('click', () => {
                setValueControl(inputA, { mode: 'fraction', fracNum: 1, fracDen: 2 });
                setValueControl(inputB, { mode: 'fraction', fracNum: 1, fracDen: 3 });
                commonDenInput.value = '6';
                operatorBtn.textContent = '+';
                operatorBtn.style.background = '#ffc107';
                fit.reset();
                createInitial();
            });

            page.querySelectorAll('.value-control input, .common-den-input').forEach(input => {
                input.addEventListener('keydown', e => { if (e.key === 'Enter') createInitial(); });
            });

            createInitial();
        }

        /* =====================================================
           곱셈
        ====================================================== */
        function initMulTool(page) {
            const inputA = page.querySelector('#mul_inputA');
            const inputB = page.querySelector('#mul_inputB');
            const previewBtn = page.querySelector('#mul_viewFrac1Btn');
            const calcBtn = page.querySelector('#mul_calcBtn');
            const resetBtn = page.querySelector('#mul_resetBtn');
            const workspace = page.querySelector('#mul_workspace');
            const inner = page.querySelector('#mul_workspace-inner');
            const fit = createFitController(page, workspace);

            function step(titleText, noteText = '') {
                const box = document.createElement('div');
                box.className = 'step-container';
                const label = document.createElement('div');
                label.className = 'step-label';
                const title = document.createElement('div');
                title.className = 'step-label-title';
                title.textContent = titleText;
                label.appendChild(title);
                if (noteText) {
                    const note = document.createElement('div');
                    note.className = 'step-note';
                    note.textContent = noteText;
                    label.appendChild(note);
                }
                box.appendChild(label);
                return box;
            }

            function renderAOnly(a, parent) {
                const stack = document.createElement('div');
                stack.className = 'mul-model-stack';
                const totalAUnits = Math.max(1, Math.ceil(a.num / a.den));

                for (let unit = 0; unit < totalAUnits; unit++) {
                    const bar = document.createElement('div');
                    bar.className = 'mul-model-bar';
                    bar.style.height = `${MUL_UNIT_HEIGHT}px`;
                    bar.style.gridTemplateColumns = `repeat(${a.den}, 1fr)`;
                    bar.style.gridTemplateRows = '1fr';
                    const remaining = a.num - unit * a.den;
                    const shadedCols = Math.max(0, Math.min(a.den, remaining));

                    for (let c = 0; c < a.den; c++) {
                        const cell = document.createElement('div');
                        cell.className = 'mul-cell';
                        cell.style.background = c < shadedCols ? COLORS.A : COLORS.EMPTY;
                        if (c < a.den - 1) cell.style.borderRight = '3px solid red';
                        bar.appendChild(cell);
                    }
                    stack.appendChild(bar);
                }
                parent.appendChild(stack);
            }

            function renderProductModel(a, b, parent) {
                const stack = document.createElement('div');
                stack.className = 'mul-model-stack';
                const totalAUnits = Math.max(1, Math.ceil(a.num / a.den));
                const multiplierBlocks = Math.max(1, Math.ceil(b.num / b.den));

                for (let block = 0; block < multiplierBlocks; block++) {
                    for (let unit = 0; unit < totalAUnits; unit++) {
                        const bar = document.createElement('div');
                        bar.className = 'mul-model-bar';
                        bar.style.gridTemplateColumns = `repeat(${a.den}, 1fr)`;
                        bar.style.gridTemplateRows = `repeat(${b.den}, 1fr)`;

                        const remainingA = a.num - unit * a.den;
                        const aCols = Math.max(0, Math.min(a.den, remainingA));

                        for (let r = 0; r < b.den; r++) {
                            const globalMultiplierRow = block * b.den + r;
                            const selectedByB = globalMultiplierRow < b.num;
                            for (let c = 0; c < a.den; c++) {
                                const inA = c < aCols;
                                const cell = document.createElement('div');
                                cell.className = 'mul-cell';
                                if (inA && selectedByB) cell.style.background = COLORS.RESULT;
                                else if (inA) cell.style.background = COLORS.A_LIGHT;
                                else cell.style.background = COLORS.EMPTY;

                                if (c < a.den - 1) cell.style.borderRight = '3px solid red';
                                if (r < b.den - 1) cell.style.borderBottom = '2px dashed #555';
                                bar.appendChild(cell);
                            }
                        }
                        stack.appendChild(bar);
                    }
                }
                parent.appendChild(stack);

                const legend = document.createElement('div');
                legend.className = 'mul-legend';
                legend.innerHTML = `
                    <span class="legend-chip"><span class="legend-color" style="background:${COLORS.RESULT}"></span>곱해서 남는 부분</span>
                    <span class="legend-chip"><span class="legend-color" style="background:${COLORS.A_LIGHT}"></span>분수 1이지만 이번 선택에는 포함되지 않은 부분</span>
                    <span class="legend-chip"><span class="legend-color" style="background:${COLORS.EMPTY}"></span>처음부터 분수 1이 아니었던 부분</span>`;
                parent.appendChild(legend);
            }

            function preview() {
                const a = readValueControl(inputA, '분수 1');
                if (!a) return;
                inner.innerHTML = '';

                const box = step(`분수 1 시각화: ${a.source}`);
                addModelNote(box, '이 바깥 사각형 하나가 “1 전체”입니다. 계산하기를 눌러도 이 크기와 모양을 그대로 이어서 사용합니다.');
                renderAOnly(a, box);
                inner.appendChild(box);
                fit.refresh();
            }

            function calculate() {
                const a = readValueControl(inputA, '분수 1');
                const b = readValueControl(inputB, '분수 2');
                if (!a || !b) return;

                inner.innerHTML = '';
                const resultNum = a.num * b.num;
                const resultDen = a.den * b.den;

                const formula = document.createElement('div');
                formula.className = 'step-container result-formula';
                formula.textContent = `(${formatFraction(a.num, a.den)}) × (${formatFraction(b.num, b.den)}) = ${resultNum}/${resultDen}`;
                inner.appendChild(formula);

                const before = step(`1단계 · 분수 1 시각화: ${a.source}`);
                addModelNote(before, '분수 1의 원래 모양입니다. 다음 단계에서도 이 사각형을 없애거나 다른 모양으로 바꾸지 않습니다.');
                renderAOnly(a, before);
                inner.appendChild(before);

                const after = step(
                    `2단계 · ${b.source}만큼 선택하기`,
                    b.den === 1 ? `${b.num}번 반복` : `${b.den}등분 중 ${b.num}만큼`
                );
                const samplerBtn = document.createElement('button');
                samplerBtn.className = 'btn btn-small btn-sampler';
                samplerBtn.textContent = '조각 꺼내기';
                after.querySelector('.step-label').appendChild(samplerBtn);

                addModelNote(after,
                    b.den === 1
                        ? '자연수를 곱하면 같은 분수 1 모양을 그 수만큼 반복합니다.'
                        : '분수 2의 모든 등분선을 그대로 보이고, 선택되지 않은 부분도 지우지 않습니다.');
                renderProductModel(a, b, after);
                inner.appendChild(after);

                samplerBtn.addEventListener('click', () => {
                    renderPieceTray(
                        after,
                        resultNum,
                        UNIT_WIDTH / a.den,
                        MUL_UNIT_HEIGHT / b.den,
                        COLORS.RESULT,
                        'MUL',
                        null,
                        `곱한 결과의 조각 ${resultNum}개 — 모두 꺼냈습니다. 조각을 직접 움직여 볼 수 있습니다.`
                    );
                    fit.refresh();
                });

                fit.refresh();
            }

            previewBtn.addEventListener('click', preview);
            calcBtn.addEventListener('click', calculate);
            resetBtn.addEventListener('click', () => {
                setValueControl(inputA, { mode: 'fraction', fracNum: 3, fracDen: 4 });
                setValueControl(inputB, { mode: 'fraction', fracNum: 2, fracDen: 3 });
                fit.reset();
                preview();
            });
            page.querySelectorAll('.value-control input').forEach(input => {
                input.addEventListener('keydown', e => { if (e.key === 'Enter') calculate(); });
            });

            preview();
        }

                if (!slots.length) return null;

                );

                resultWs.innerHTML = '';
                resultWs.style.display = 'block';
                pocketCount = 0;

                const formula = document.createElement('div');
                formula.className = 'result-formula';
                formula.textContent = `(${numA}/${commonDen}) ÷ (${numB}/${commonDen}) = ${numA} ÷ ${numB} = ${numA}/${numB}`;

                const labelRow = document.createElement('div');
                labelRow.className = 'workspace-label-row';
                const label = document.createElement('div');
                label.className = 'workspace-label';
                label.textContent = `새로운 기준 ‘1’: ${numB}조각`;
                labelRow.appendChild(label);
                resultWs.appendChild(labelRow);

                const help = document.createElement('div');
                help.className = 'magnet-help';
                help.textContent = `초록색 테두리 주머니 하나가 새로운 1입니다. 위의 나눠지는 수 아래에서 꺼낸 파란 조각을 가까이 가져가면 착 붙습니다.`;
                resultWs.appendChild(help);

                const pieceWidth = UNIT_WIDTH / commonDen;
                const pocketsWrap = document.createElement('div');
                pocketsWrap.className = 'division-pockets-wrap';

                // 모든 조각을 담아 볼 수 있을 만큼은 자동으로 만들고, 필요하면 더 추가합니다.
                const initialPockets = Math.max(1, Math.ceil(numA / numB));
                for (let i = 0; i < initialPockets; i++) {
                    pocketsWrap.appendChild(createPocket(numB, pieceWidth));
                }
                resultWs.appendChild(pocketsWrap);

                const addPocket = document.createElement('button');
                addPocket.className = 'btn btn-small btn-add-pocket';
                addPocket.textContent = '주머니 추가 ➕';
                addPocket.addEventListener('click', () => {
                    pocketsWrap.appendChild(createPocket(numB, pieceWidth));
                    fit.refresh();
                });
                resultWs.appendChild(addPocket);
                fit.refresh();
            }

            createBtn.addEventListener('click', createInitial);
            convertBtn.addEventListener('click', convert);
            resultBtn.addEventListener('click', showPieces);
            resetBtn.addEventListener('click', () => {
                setValueControl(inputA, { mode: 'fraction', fracNum: 1, fracDen: 2 });
                setValueControl(inputB, { mode: 'fraction', fracNum: 2, fracDen: 3 });
                commonDenInput.value = '6';
                fit.reset();
                createInitial();
            });
            page.querySelectorAll('.value-control input, .common-den-input').forEach(input => {
                input.addEventListener('keydown', e => { if (e.key === 'Enter') createInitial(); });
            });

            createInitial();
        }

        /* =====================================================
           시작 / 네비게이션
        ====================================================== */
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.value-control').forEach(setupValueControl);

            const main = document.getElementById('main-menu-page');
            const addsub = document.getElementById('addsub-page');
            const mul = document.getElementById('mul-page');
            const div = document.getElementById('div-page');
            const pages = [main, addsub, mul, div];

            function showPage(target) {
                pages.forEach(p => p.style.display = 'none');
                target.style.display = target === main ? 'flex' : 'block';
                target.querySelector('.workspace')?.scrollTo({ top: 0, behavior: 'auto' });
            }

            document.getElementById('btn-goto-addsub').addEventListener('click', () => showPage(addsub));
            document.getElementById('btn-goto-mul').addEventListener('click', () => showPage(mul));
            document.getElementById('btn-goto-div').addEventListener('click', () => showPage(div));
            document.querySelectorAll('.btn-back').forEach(btn => btn.addEventListener('click', () => showPage(main)));

            initAddSubTool(addsub);
            initMulTool(mul);
            initDivTool(div);
        });
    </script>
</body>
</html>
